<!DOCTYPE html>
<!-- REFERENCE for text-align-start.html. The physical `left` keyword produces the
     identical layout for every LTR case, which is the property that makes changing
     the initial value from `left` to `start` byte-identical for LTR content. -->
<html>
<head>
<style>
  body { margin: 0; font-family: serif; font-size: 16px; }
  div { width: 300px; }
  #a { text-align: left; }
  #b { text-align: left; }
  #c { text-align: left; }
</style>
</head>
<body>
  <div id="a">Ridge</div>
  <div id="b">Ridge</div>
  <div id="c">Ridge</div>
</body>
</html>
