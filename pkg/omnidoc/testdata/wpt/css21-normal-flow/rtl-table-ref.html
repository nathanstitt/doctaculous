<!DOCTYPE html>
<!-- REFERENCE for rtl-table.html: the same three swatches authored in mirrored
     source order as an LTR table. Cell 1 (40px, red) ends up right-most at
     [140,180), cell 2 (80px, orange) at [60,140), cell 3 (60px, green) at [0,60). -->
<html><head><style>
  body { margin: 0; }
  table { border-collapse: collapse; table-layout: fixed; width: 180px; }
  td { padding: 0; height: 40px; }
</style></head><body>
  <table><tr>
    <td style="width: 60px; background: #3a7d5a;"></td>
    <td style="width: 80px; background: #d9822b;"></td>
    <td style="width: 40px; background: #c8401a;"></td>
  </tr></table>
</body></html>
