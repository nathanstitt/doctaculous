<!DOCTYPE html>
<!-- TEST: dir=rtl on a table mirrors the column order — the first cell in document
     order lays out right-most. Distinct widths so a true mirror is distinguishable
     from a plain index reversal. -->
<html><head><style>
  body { margin: 0; }
  table { border-collapse: collapse; table-layout: fixed; width: 180px; }
  td { padding: 0; height: 40px; }
</style></head><body>
  <table dir="rtl"><tr>
    <td style="width: 40px; background: #c8401a;"></td>
    <td style="width: 80px; background: #d9822b;"></td>
    <td style="width: 60px; background: #3a7d5a;"></td>
  </tr></table>
</body></html>
