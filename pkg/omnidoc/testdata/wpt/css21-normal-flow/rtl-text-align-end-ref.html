<!DOCTYPE html>
<!-- REFERENCE for rtl-text-align-end.html, using the PHYSICAL keywords. Because the
     text is Latin (direction-neutral for this engine, which does not yet reorder
     glyphs within a line), an rtl block with text-align:end renders identically to
     an ltr block with text-align:left. -->
<html><head><style>
  body { margin: 0; font-family: serif; font-size: 16px; }
  div { width: 300px; }
</style></head><body>
  <div style="text-align: left;">Ridge</div>
  <div style="text-align: right;">Ridge</div>
</body></html>
