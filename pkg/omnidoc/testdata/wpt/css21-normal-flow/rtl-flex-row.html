<!DOCTYPE html>
<!-- TEST: direction:rtl on a flex ROW reverses the main axis, because the main axis
     IS the inline axis. Three distinct-width items pack from the right edge. -->
<html><head><style>
  body { margin: 0; }
  .row { display: flex; direction: rtl; width: 200px; }
  .a { width: 30px; height: 40px; background: #c8401a; }
  .b { width: 50px; height: 40px; background: #d9822b; }
  .c { width: 20px; height: 40px; background: #3a7d5a; }
</style></head><body>
  <div class="row"><div class="a"></div><div class="b"></div><div class="c"></div></div>
</body></html>
