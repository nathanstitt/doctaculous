<!DOCTYPE html>
<!-- REFERENCE for flex-wrap.html: the same four swatches placed absolutely at the
     rects two-per-line wrapping produces, independent of the flex code. -->
<html><head><style>
  body { margin: 0; position: relative; height: 60px; }
  .box { position: absolute; width: 70px; height: 30px; background: #336699; }
</style></head><body>
  <div class="box" style="left: 0;   top: 0;"></div>
  <div class="box" style="left: 70px; top: 0;"></div>
  <div class="box" style="left: 0;   top: 30px;"></div>
  <div class="box" style="left: 70px; top: 30px;"></div>
</body></html>
