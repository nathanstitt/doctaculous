name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # Without this, a job inherits GitHub's 6-hour default and a runner that
    # never picks up the work sits "queued" indefinitely — one run on this repo
    # was stuck for over 25 hours, holding up a stacked PR chain with no signal
    # either way. The race suite is the long pole at a few minutes, so 30 is
    # generous headroom over a normal run while still failing fast on a hang.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          fmtout=$(gofmt -l .)
          if [ -n "$fmtout" ]; then
            echo "These files are not gofmt-clean:"
            echo "$fmtout"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (race + coverage)
        # -p bounds how many package binaries run at once. Without it the suite
        # peaks at ~13.3 GB RSS against this runner's 16 GB and the kernel kills
        # it (SIGTERM, exit 143) minutes into a 30-minute budget. Three levels of
        # parallelism compound: go test runs packages up to GOMAXPROCS, each
        # package runs its t.Parallel tests, and every rasterize opens a
        # GOMAXPROCS-sized worker pool — then -race multiplies the footprint.
        # Capping the outermost level is the one knob that does not cost
        # coverage or serialize the suite.
        run: go test -race -p 2 -coverprofile=coverage.out ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    # See the test job's timeout for why this is set explicitly. Lint builds
    # golangci-lint from source (install-mode: goinstall below), so it is
    # slower than a prebuilt binary would be but still well inside 30 minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          # Build golangci-lint from source with the Go toolchain set up above
          # (go.mod targets a newer Go than the prebuilt release binaries are
          # built with, which the version-skew guard rejects).
          install-mode: goinstall
